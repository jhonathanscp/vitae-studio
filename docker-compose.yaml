services:
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    environment:
      - TZ=America/Sao_Paulo
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      - TZ=America/Sao_Paulo
      - API_HOST=0.0.0.0
      - API_PORT=3000
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - PUPPETEER_HEADLESS=true
      - PUPPETEER_EXECUTABLE_PATH=/usr/bin/chromium
      - RESOURCES_DIR=/app/resources
    volumes:
      - api_resources:/app/resources
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
      args:
        - VITE_API_URL=${VITE_API_URL:-/api}
    restart: unless-stopped
    expose:
      - "80"
    environment:
      - TZ=America/Sao_Paulo
    depends_on:
      api:
        condition: service_healthy

volumes:
  redis_data:
    driver: local
  api_resources:
    driver: local
